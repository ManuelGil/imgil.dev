name: Bundlesize

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bundlesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install bundlesize
        run: npm install -g bundlesize
      - name: Run bundlesize
        run: bundlesize
